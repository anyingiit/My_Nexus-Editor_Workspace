[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-v3"
version = "3.0.0"
description = "Budget-bounded, auditable orchestration and evaluation harness for AGENTS.md experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
agents-v3 = "agents_v3.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/agents-v3" = ["AGENTS.md", "README.md", "requirements.lock"]
"share/agents-v3/config" = ["config/*.yaml", "config/README.md"]
"share/agents-v3/docs" = ["docs/*.md"]
"share/agents-v3/protocol" = ["protocol/*.md"]
"share/agents-v3/schemas" = ["schemas/*.json"]
"share/agents-v3/sandbox" = ["sandbox/Containerfile.runner", "sandbox/README.md", "sandbox/*.json", "sandbox/*.py", "sandbox/*.sh"]
